name: CI

# Lint + test on every push to main and on PRs targeting main.
# "Lint" here is the project's static gate: there is no separate linter — a clean
# `tsc --strict` build is the check (see CLAUDE.md). The test step runs the
# dependency-free unit suite on Node's built-in test runner. Neither step needs a
# device, so the platform-agnostic core is fully covered in CI.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Verified locally on 20; 22 is the current LTS. Bump/extend as needed
      # (the package targets Node >= 18).
      matrix:
        node-version: ['20.x', '22.x']

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          # Pin the cache key to the ROOT lockfile. Without this, setup-node globs the
          # workspace recursively and docs/package-lock.json (the docs site, a separate
          # npm project) would feed into the hash — busting this cache on every docs edit.
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (TypeScript strict type-check)
        run: npm run build

      # `test:ci` runs the suite through two reporters at once: `spec` to stdout
      # (the readable ✔/✖ list you see in this log) and a small custom reporter
      # (scripts/github-test-summary.mjs) to test-results/summary.md.
      - name: Test (unit suite)
        run: npm run test:ci
        env:
          TEST_SUMMARY_LABEL: Node ${{ matrix.node-version }}

      # Packs the tarball and asserts its actual contents. The unit suite checks
      # package.json's "files" allowlist (our intent); this checks the artifact (the
      # result). The gap between them is where the "no CHANGELOG.md for six releases"
      # bug lived — publish succeeded and CI was green the whole time. Runs on PRs so
      # a packaging mistake is caught at review, not at `git push --tags`.
      - name: Verify npm package contents
        run: node scripts/check-package-contents.mjs

      # Surface that markdown summary on the run's page (the "Summary" tab), so a
      # formatted test list is one click away instead of buried in the log.
      # `always()` so it still reports when tests fail — that is when it matters.
      # `touch` keeps this robust if a compile error meant the reporter never
      # wrote the file: cat an empty file rather than fail (or echo a warning the
      # Actions log would surface even on a green run).
      - name: Publish test summary
        if: always()
        run: |
          mkdir -p test-results
          touch test-results/summary.md
          cat test-results/summary.md >> "$GITHUB_STEP_SUMMARY"
