<!-- Dark-theme twin of illustration-light.svg: black -> #FFFFFA, face plate -> #17181C. Keep the animation CSS in sync. -->
<svg width="183" height="253" viewBox="0 0 183 253" fill="none" xmlns="http://www.w3.org/2000/svg">
<style>
  /* 12s expression loop: neutral → blink → look up-right → concentrate → think → surprised → neutral */
  .face-feature { transform-box: fill-box; }
  #eye-left  { transform-origin: center; animation: eyeLeft 12s ease-in-out infinite; }
  #eye-right { transform-origin: center; animation: eyeRight 12s ease-in-out infinite; }
  #mouth     { transform-origin: center; animation: mouthMood 12s ease-in-out infinite; }

  @keyframes eyeLeft {
    0%, 8%   { transform: translate(0,0) scale(1,1); }
    9.2%     { transform: translate(0,18px) scale(1,.08); }
    10.4%    { transform: translate(0,0) scale(1,1); }
    18%, 28% { transform: translate(5px,-7px) scale(.88,.82); }
    36%, 46% { transform: translate(2px,4px) scale(1.05,.58); }
    54%, 65% { transform: translate(5px,1px) scale(.92,.48) rotate(-5deg); }
    73%, 84% { transform: translate(-2px,-7px) scale(1.18,1.18); }
    94%,100% { transform: translate(0,0) scale(1,1); }
  }
  @keyframes eyeRight {
    0%, 8%   { transform: translate(0,0) scale(1,1); }
    9.2%     { transform: translate(0,18px) scale(1,.08); }
    10.4%    { transform: translate(0,0) scale(1,1); }
    18%, 28% { transform: translate(5px,-7px) scale(.88,.82); }
    36%, 46% { transform: translate(-2px,4px) scale(1.05,.58); }
    54%, 65% { transform: translate(-5px,1px) scale(.92,.48) rotate(5deg); }
    73%, 84% { transform: translate(2px,-7px) scale(1.18,1.18); }
    94%,100% { transform: translate(0,0) scale(1,1); }
  }
  @keyframes mouthMood {
    0%, 28%  { transform: translate(0,0) scale(1,1); }
    36%, 46% { transform: translate(-1px,3px) scale(.78,.72) rotate(-4deg); }
    54%, 65% { transform: translate(-4px,1px) scale(.62,.55) rotate(8deg); }
    73%, 84% { transform: translate(-8px,-3px) scale(.42,.42) rotate(-18deg); }
    94%,100% { transform: translate(0,0) scale(1,1); }
  }

  @media (prefers-reduced-motion: reduce) {
    #eye-left, #eye-right, #mouth { animation: none; }
  }
</style>
