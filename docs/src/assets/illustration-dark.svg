<!-- Dark-theme twin of illustration-light.svg, identical except the palette line. Keep the art and animation CSS in sync. -->
<svg width="183" height="253" viewBox="37.54 6 164.92 228" fill="none" xmlns="http://www.w3.org/2000/svg">
<style>
  svg{--ink:#FFFFFA;--paper:#17181C;--strong:#D6D6CF;--muted:#33343A;--line:#55565D;--soft:#4A4B52;--spot:#C8C8C1}
  /* One 13s timeline and no animation-delay, so every frame is a function of t mod 13s and the
     screens never drift apart. Keyframe % = seconds / 13 x 100.
     0.15 carousel builds · 1.2 swipe to page 2 · 2.4 swipe on to login · 3.25 login builds
     4.45 tap the button · 5.05 list builds · 6.25 tap row 1 · 6.85 details build
     7.6-12.6 wait 5s · 12.85 blank, loop.
     Only opacity and translate are animated: Safari diverges on SVG scale/transform-origin. */
  .ink{fill:var(--ink)}.paper{fill:var(--paper)}.strong{fill:var(--strong)}.muted{fill:var(--muted)}.soft{fill:var(--soft)}
  .x{stroke:var(--line);stroke-width:1.2;stroke-linecap:round}
  .field{fill:var(--paper);stroke:var(--line);stroke-width:1.4}
  .label{fill:var(--paper);fill-opacity:.8}
  .pressc{fill:var(--paper)}
  .hlc{fill:var(--ink);fill-opacity:.07}
  .spotc{fill:var(--spot);fill-opacity:.5;stroke:var(--ink);stroke-opacity:.3;stroke-width:1.2}
  /* Without motion, the base styles are one still frame: the login screen, its button being tapped. */
  .scrC,.scrS,.scrD,.hl{opacity:0}.press{opacity:.35}.spot{transform:translate(62px,148.5px)}
  .a{animation:13s linear infinite}
  .scrC{animation-name:scrC}.pC1{animation-name:pC1}.pC2{animation-name:pC2}.track{animation-name:track}.dots{animation-name:dots}.pill{animation-name:pill}.scrL{animation-name:scrL}.pL1{animation-name:pL1}.pL2{animation-name:pL2}.pL3{animation-name:pL3}.press{animation-name:press}.scrS{animation-name:scrS}.pS1{animation-name:pS1}.pS2{animation-name:pS2}.pS3{animation-name:pS3}.hl{animation-name:hl}.scrD{animation-name:scrD}.pD1{animation-name:pD1}.pD2{animation-name:pD2}.pD3{animation-name:pD3}.pD4{animation-name:pD4}.pD5{animation-name:pD5}.spot{animation-name:spot}
  @keyframes scrC{0%{opacity:1}24.615%{opacity:1}24.692%{opacity:0}99.923%{opacity:0}100%{opacity:1}}
  @keyframes pC1{0%{opacity:0;transform:translateY(3px)}1.154%{opacity:0;transform:translateY(3px);animation-timing-function:cubic-bezier(.2,.7,.3,1)}3.462%{opacity:1;transform:translateY(0)}24.615%{opacity:1;transform:translateY(0)}24.692%{opacity:0;transform:translateY(3px)}100%{opacity:0;transform:translateY(3px)}}
  @keyframes pC2{0%{opacity:0;transform:translateY(3px)}2.308%{opacity:0;transform:translateY(3px);animation-timing-function:cubic-bezier(.2,.7,.3,1)}4.615%{opacity:1;transform:translateY(0)}24.615%{opacity:1;transform:translateY(0)}24.692%{opacity:0;transform:translateY(3px)}100%{opacity:0;transform:translateY(3px)}}
  @keyframes track{0%{transform:translateX(0px)}9.231%{transform:translateX(0px)}12.308%{transform:translateX(-44px);animation-timing-function:cubic-bezier(.2,.7,.3,1)}15%{transform:translateX(-96px)}18.462%{transform:translateX(-96px)}21.538%{transform:translateX(-140px);animation-timing-function:cubic-bezier(.2,.7,.3,1)}24.231%{transform:translateX(-192px)}24.769%{transform:translateX(-192px)}24.846%{transform:translateX(0px)}100%{transform:translateX(0px)}}
  @keyframes dots{0%{transform:translateX(0px)}18.462%{transform:translateX(0px)}21.538%{transform:translateX(-44px);animation-timing-function:cubic-bezier(.2,.7,.3,1)}24.231%{transform:translateX(-96px)}24.769%{transform:translateX(-96px)}24.846%{transform:translateX(0px)}100%{transform:translateX(0px)}}
  @keyframes pill{0%{transform:translateX(0px)}12.308%{transform:translateX(0px);animation-timing-function:cubic-bezier(.45,0,.25,1)}15%{transform:translateX(10px)}24.769%{transform:translateX(10px)}24.846%{transform:translateX(0px)}100%{transform:translateX(0px)}}
  @keyframes scrL{0%{opacity:0}24.923%{opacity:0}25%{opacity:1}36.538%{opacity:1}38.077%{opacity:0}100%{opacity:0}}
  @keyframes pL1{0%{opacity:0;transform:translateY(3px)}25%{opacity:0;transform:translateY(3px);animation-timing-function:cubic-bezier(.2,.7,.3,1)}27.308%{opacity:1;transform:translateY(0)}38.077%{opacity:1;transform:translateY(0)}38.154%{opacity:0;transform:translateY(3px)}100%{opacity:0;transform:translateY(3px)}}
  @keyframes pL2{0%{opacity:0;transform:translateY(3px)}26.154%{opacity:0;transform:translateY(3px);animation-timing-function:cubic-bezier(.2,.7,.3,1)}28.462%{opacity:1;transform:translateY(0)}38.077%{opacity:1;transform:translateY(0)}38.154%{opacity:0;transform:translateY(3px)}100%{opacity:0;transform:translateY(3px)}}
  @keyframes pL3{0%{opacity:0;transform:translateY(3px)}27.308%{opacity:0;transform:translateY(3px);animation-timing-function:cubic-bezier(.2,.7,.3,1)}29.615%{opacity:1;transform:translateY(0)}38.077%{opacity:1;transform:translateY(0)}38.154%{opacity:0;transform:translateY(3px)}100%{opacity:0;transform:translateY(3px)}}
  @keyframes press{0%{opacity:0}34.231%{opacity:0}34.615%{opacity:.35}35.923%{opacity:.35}37.462%{opacity:0}100%{opacity:0}}
  @keyframes scrS{0%{opacity:0}38.769%{opacity:0}38.846%{opacity:1}50.385%{opacity:1}51.923%{opacity:0}100%{opacity:0}}
  @keyframes pS1{0%{opacity:0;transform:translateY(3px)}38.846%{opacity:0;transform:translateY(3px);animation-timing-function:cubic-bezier(.2,.7,.3,1)}41.154%{opacity:1;transform:translateY(0)}51.923%{opacity:1;transform:translateY(0)}52%{opacity:0;transform:translateY(3px)}100%{opacity:0;transform:translateY(3px)}}
  @keyframes pS2{0%{opacity:0;transform:translateY(3px)}40%{opacity:0;transform:translateY(3px);animation-timing-function:cubic-bezier(.2,.7,.3,1)}42.308%{opacity:1;transform:translateY(0)}51.923%{opacity:1;transform:translateY(0)}52%{opacity:0;transform:translateY(3px)}100%{opacity:0;transform:translateY(3px)}}
  @keyframes pS3{0%{opacity:0;transform:translateY(3px)}41.154%{opacity:0;transform:translateY(3px);animation-timing-function:cubic-bezier(.2,.7,.3,1)}43.462%{opacity:1;transform:translateY(0)}51.923%{opacity:1;transform:translateY(0)}52%{opacity:0;transform:translateY(3px)}100%{opacity:0;transform:translateY(3px)}}
  @keyframes hl{0%{opacity:0}48.077%{opacity:0}48.538%{opacity:1}51.923%{opacity:1}52%{opacity:0}100%{opacity:0}}
  @keyframes scrD{0%{opacity:0}52.615%{opacity:0}52.692%{opacity:1}96.923%{opacity:1}98.846%{opacity:0}100%{opacity:0}}
  @keyframes pD1{0%{opacity:0;transform:translateY(3px)}52.692%{opacity:0;transform:translateY(3px);animation-timing-function:cubic-bezier(.2,.7,.3,1)}55%{opacity:1;transform:translateY(0)}98.846%{opacity:1;transform:translateY(0)}98.923%{opacity:0;transform:translateY(3px)}100%{opacity:0;transform:translateY(3px)}}
  @keyframes pD2{0%{opacity:0;transform:translateY(3px)}53.846%{opacity:0;transform:translateY(3px);animation-timing-function:cubic-bezier(.2,.7,.3,1)}56.154%{opacity:1;transform:translateY(0)}98.846%{opacity:1;transform:translateY(0)}98.923%{opacity:0;transform:translateY(3px)}100%{opacity:0;transform:translateY(3px)}}
  @keyframes pD3{0%{opacity:0;transform:translateY(3px)}54.615%{opacity:0;transform:translateY(3px);animation-timing-function:cubic-bezier(.2,.7,.3,1)}56.923%{opacity:1;transform:translateY(0)}98.846%{opacity:1;transform:translateY(0)}98.923%{opacity:0;transform:translateY(3px)}100%{opacity:0;transform:translateY(3px)}}
  @keyframes pD4{0%{opacity:0;transform:translateY(3px)}55.385%{opacity:0;transform:translateY(3px);animation-timing-function:cubic-bezier(.2,.7,.3,1)}57.692%{opacity:1;transform:translateY(0)}98.846%{opacity:1;transform:translateY(0)}98.923%{opacity:0;transform:translateY(3px)}100%{opacity:0;transform:translateY(3px)}}
  @keyframes pD5{0%{opacity:0;transform:translateY(3px)}56.154%{opacity:0;transform:translateY(3px);animation-timing-function:cubic-bezier(.2,.7,.3,1)}58.462%{opacity:1;transform:translateY(0)}98.846%{opacity:1;transform:translateY(0)}98.923%{opacity:0;transform:translateY(3px)}100%{opacity:0;transform:translateY(3px)}}
  @keyframes spot{0%{opacity:0;transform:translate(74px,170px)}9.154%{opacity:0;transform:translate(74px,170px)}9.231%{opacity:1;transform:translate(74px,170px)}12.308%{opacity:1;transform:translate(30px,170px)}14.615%{opacity:0;transform:translate(30px,170px)}18.385%{opacity:0;transform:translate(74px,170px)}18.462%{opacity:1;transform:translate(74px,170px)}21.538%{opacity:1;transform:translate(30px,170px)}23.846%{opacity:0;transform:translate(30px,170px)}34.154%{opacity:0;transform:translate(62px,148.5px)}34.231%{opacity:1;transform:translate(62px,148.5px)}35.154%{opacity:1;transform:translate(62px,148.5px)}37.462%{opacity:0;transform:translate(62px,148.5px)}48%{opacity:0;transform:translate(57px,93px)}48.077%{opacity:1;transform:translate(57px,93px)}49%{opacity:1;transform:translate(57px,93px)}51.308%{opacity:0;transform:translate(57px,93px)}51.385%{opacity:0;transform:translate(74px,170px)}100%{opacity:0;transform:translate(74px,170px)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
